const questions = [{"prompt":"적색 신호에서 우회전하려면?","options":["차가 없으면 정지 없이 진입한다","먼저 정지선 앞에 멈춘 뒤 주변을 확인한다","뒤차가 경적을 울리면 바로 진입한다","비상등을 켜면 정지 의무가 없다"],"correct":[1],"explanation":"적색 신호에서는 먼저 정지하고 다른 교통을 방해하지 않는 범위에서 진행한다. 우회전 전용 신호가 있으면 그 신호를 따른다.","type":"문장형","points":2},{"prompt":"횡단보도 앞에 서 있는 사람이 건너려 한다. 정지선이 있을 때 어디에서 멈추는가?","options":["횡단보도 위","교차로 중앙","정지선 앞","횡단보도를 지난 직후"],"correct":[2],"explanation":"횡단 중이거나 횡단하려는 보행자가 있으면 정지선 앞에서 일시정지한다.","type":"문장형","points":2},{"prompt":"어린이 보호구역의 신호기 없는 횡단보도에 사람이 보이지 않는다. 어떻게 하는가?","options":["정지선 앞에서 일시정지한다","경적만 울린다","속도만 낮추고 통과한다","앞차가 통과하면 그대로 따른다"],"correct":[0],"explanation":"어린이 보호구역의 신호기 없는 횡단보도에서는 보행자 유무와 관계없이 일시정지한다.","type":"문장형","points":2},{"prompt":"회전교차로에 진입하려는데 왼쪽에서 회전 차량이 다가온다. 우선권은 누구에게 있는가?","options":["진입 차량","큰 차량","오른쪽 차량","이미 회전 중인 차량"],"correct":[3],"explanation":"진입 차량은 회전 중인 차량에 진로를 양보한다.","type":"문장형","points":2},{"prompt":"구급차가 사이렌을 울리며 접근하고 내 차는 교차로에 있다. 어떻게 하는가?","options":["교차로 중앙에 즉시 멈춘다","교차로를 피해 일시정지한다","구급차 바로 앞에서 가속한다","교차로에서 후진한다"],"correct":[1],"explanation":"교차로 또는 그 부근에서는 긴급자동차가 통과할 수 있도록 교차로를 피해 일시정지한다.","type":"문장형","points":2},{"prompt":"신호등 없는 교차로에서 폭이 넓은 도로의 차량이 접근한다. 좁은 도로에서 진입하려면?","options":["좁은 도로 차량이 우선이다","먼저 경적을 울린 차가 우선이다","서행하며 넓은 도로의 차량에 양보한다","좌회전 차량이 항상 우선이다"],"correct":[2],"explanation":"교통정리가 없는 교차로에서 폭이 넓은 도로의 차량에 진로를 양보한다.","type":"문장형","points":2},{"prompt":"폭이 같은 두 도로에서 차가 동시에 신호 없는 교차로에 진입하려 한다. 둘 다 직진할 때 양보할 상대는?","options":["오른쪽 도로에서 오는 차","왼쪽 도로에서 오는 차","뒤따르는 차","차체가 작은 차"],"correct":[0],"explanation":"동시에 진입하려는 경우 오른쪽 도로의 차량에 진로를 양보한다.","type":"문장형","points":2},{"prompt":"황색 점멸 신호의 의미는?","options":["항상 일시정지","통행 금지","직진 금지","다른 교통에 주의하면서 진행 가능"],"correct":[3],"explanation":"황색 점멸은 주의하면서 진행할 수 있다는 뜻이다. 적색 점멸에서는 먼저 일시정지한다.","type":"문장형","points":2},{"prompt":"적색 점멸 신호를 만났다. 어떻게 하는가?","options":["서행만 하면 된다","일시정지 후 안전을 확인한다","보행자 신호로만 판단한다","다른 차가 멈추면 정지 없이 통과한다"],"correct":[1],"explanation":"적색 점멸에서는 정지선이나 횡단보도 직전 등에서 일시정지한다.","type":"문장형","points":2},{"pro const app=document.querySelector('#app');
const dialog=document.querySelector('#submitDialog');
const key='kr-class1-mock-v1';
let state;
try {state=JSON.parse(sessionStorage.getItem(key));} catch {}
let clip;
const persist=()=>{try{sessionStorage.setItem(key,JSON.stringify(state));}catch{}};
const complete=(i)=>state.answers[i].length===questions[i].correct.length;
const grade=(i)=>complete(i)&&questions[i].correct.every(a=>state.answers[i].includes(a));
const score=()=>questions.reduce((n,q,i)=>n+(grade(i)?q.points:0),0);
const answered=()=>questions.filter((_,i)=>complete(i)).length;
function start(){state={current:0,answers:questions.map(()=>[]),deadline:Date.now()+2400000,finished:false};persist();render();}
function finish(){if(!state||state.finished)return;state.finished=true;persist();if(dialog.open)dialog.close();render();window.scrollTo(0,0);}
function step(i){state.current=i;persist();render();document.querySelector('#question').focus({preventScroll:true});window.scrollTo(0,0);}
function pick(a){
 if(Date.now()>=state.deadline){finish();return;}
 const i=state.current, chosen=state.answers[i], max=questions[i].correct.length;
 if(chosen.includes(a))state.answers[i]=chosen.filter(x=>x!==a);
 else if(max===1)state.answers[i]=[a];
 else if(chosen.length<max)chosen.push(a);
 else {document.querySelector('#choiceHint').textContent='이미 2개를 골랐습니다. 바꾸려면 선택한 보기를 먼저 해제하세요.';return;}
 persist();updateChoices();
}
function updateChoices(){
 const i=state.current;
 app.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',state.answers[i].includes(+b.dataset.option)));
 app.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('done',complete(+b.dataset.step)));
 document.querySelector('#progress').textContent='답안 완료 '+answered()+' / 40';
 document.querySelector('#choiceHint').textContent='정답 '+questions[i].correct.length+'개를 선택하세요.';
}
function tick(){
 if(!state||state.finished)return;
 const seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
 if(!seconds){finish();return;}
 const timer=document.querySelector('#timer');
 if(timer){timer.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');timer.classList.toggle('low',seconds<=300);}
}
function render(){
 cancelAnimationFrame(clip);
 if(!state){
 app.innerHTML='<div class="hero"><p class="eyebrow">제1종 보통 · 고난도 연습</p><h1>운전면허 학과시험<br>실전 모의고사</h1><p>신호·우선통행·돌발상황을 풀고, 제출 즉시 점수와 해설을 확인하세요.</p><div class="metrics"><div><strong>40</strong>문항</div><div><strong>40분</strong>제한 시간</div><div><strong>70점</strong>합격 기준 / 100점</div></div><p class="hint">문장 21 · 도식 6(사진형 대체) · 일러스트 7 · 안전표지 5 · 애니메이션 1. 공개 문제은행의 주제를 바탕으로 연습 문항을 직접 구성했습니다.</p><button class="primary" data-action="start">시험 시작</button></div>';
 return;
 }
 if(state.finished){showResult();return;}
 const i=state.current,q=questions[i];
 app.innerHTML='<div class="bar"><strong id="progress"></strong><span class="timer" id="timer" aria-label="남은 시간"></span></div><div class="layout"><section class="panel"><p class="meta">'+(i+1)+'번 · '+q.type+' · '+q.points+'점</p><h2 id="question" tabindex="-1">'+q.prompt+'</h2>'+
 (i>=21?'<canvas id="scene" width="640" height="'+(i>=34&&i<39?200:290)+'" role="img" aria-label="문항의 상황 또는 표지를 나타낸 그림"></canvas>':'')+(i===39?'<button data-action="play">장면 다시 재생</button>':'')+
 '<p class="hint" id="choiceHint" aria-live="polite"></p><div class="options">'+q.options.map((o,j)=>'<button type="button" data-option="'+j+'" aria-pressed="false">'+(j+1)+'. '+o+'</button>').join('')+'</div><div class="actions"><button data-step="'+(i-1)+'" '+(!i?'disabled':'')+'>이전</button><button '+(i<39?'data-step="'+(i+1)+'"':'data-action="submit"')+' class="primary">'+(i<39?'다음':'시험 제출')+'</button></div></section><aside class="panel"><p><strong>문항 이동</strong></p><div class="grid">'+questions.map((_,j)=>'<button data-step="'+j+'" '+(j===i?'class="active" aria-current="step"':'')+'>'+(j+1)+'</button>').join('')+'</div><button data-action="submit">시험 제출</button></aside></div>';
 updateChoices();tick();if(state.finished)return;
 if(i>=21){if(i===39)play();else draw(i);}
}
function showResult(){
 const total=score(), count=questions.filter((_,i)=>grade(i)).length;
 app.innerHTML='<section class="panel"><p class="eyebrow">제1종 보통 모의고사 결과</p><h1 class="score">'+total+'점</h1><h2>'+(total>=70?'합격':'불합격')+'</h2><p>100점 만점 · 합격 기준 70점 · 정답 '+count+' / 40</p><button class="primary" data-action="start">다시 응시</button></section><section class="panel review"><h2>문항별 결과와 해설</h2>'+questions.map((q,i)=>'<details><summary>'+(i+1)+'번 · '+(grade(i)?'정답':complete(i)?'오답':'미완료')+' · '+(grade(i)?q.points:0)+' / '+q.points+'점</summary><p>'+q.prompt+'</p><p>내 답안 '+(state.answers[i].map(j=>(j+1)+'. '+q.options[j]).join(' / ')||'미선택')+'</p><p><strong>정답 '+q.correct.map(j=>(j+1)+'. '+q.options[j]).join(' / ')+'</strong></p><p>'+q.explanation+'</p></details>').join('')+'</section>';
}
function play(){
 cancelAnimationFrame(clip);
 const start=performance.now();
 function frame(now){const t=Math.min(1,(now-start)/5500);draw(39,t);if(t<1)clip=requestAnimationFrame(frame);}
 clip=requestAnimationFrame(frame);
}
function draw(i,t=1){
 const canvas=document.querySelector('#scene');if(!canvas)return;
 const c=canvas.getContext('2d');
 const box=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h);};
 const circle=(x,y,r,color)=>{c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.fill();};
 const label=(s,x,y,color='#fff',size=18)=>{c.fillStyle=color;c.font='bold '+size+'px sans-serif';c.textAlign='center';c.fillText(s,x,y);};
 const car=(x,y,color,name,w=44,h=74)=>{box(x-3,y+9,w+6,h-18,'#1c292d');box(x,y,w,h,color);box(x+5,y+13,w-10,15,'#c2dbe6');box(x+5,y+h-17,w-10,8,'#a5c1cb');label(name,x+w/2,y+Math.min(h-19,48));};
 if(i>=34&&i<39){
 box(0,0,640,200,'#edf4f0');
 if(i===35||i===37){
 c.beginPath();
 const pts=i===35?Array.from({length:8},(_,j)=>[320+66*Math.cos((j+.5)*Math.PI/4),100+66*Math.sin((j+.5)*Math.PI/4)]):[[251,49],[389,49],[320,166]];
 pts.forEach(([x,y],j)=>j?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=i===35?'#bf2529':'#fff';c.fill();c.lineWidth=10;c.strokeStyle='#bd2529';c.stroke();label(i===35?'정지':'양보',320,106,i===35?'#fff':'#19221e',24);
 }else{
 circle(320,100,65,'#c72931');
 if(i===34)box(274,91,92,18,'#fff');
 if(i===36){circle(320,100,54,'#fff');label('40',320,117,'#182520',46);}
 if(i===38){circle(320,100,54,'#145595');c.strokeStyle='#c72931';c.lineWidth=12;c.beginPath();c.moveTo(280,60);c.lineTo(360,140);c.moveTo(360,60);c.lineTo(280,140);c.stroke();}
 }return;
 }
 box(0,0,640,290,'#a6bcb0');
 box(141,0,354,290,i===22?'#617986':'#4e5b62');
 for(let y=0;y<290;y+=43)box(317,y,5,25,'#f4cf6e');
 if([24,27,29,30,31,32,39].includes(i)){
 box(0,0,640,101,'#4e5b62');
 for(let x=154;x<490;x+=24)box(x,130,11,32,'#f2f5f3');
 box(326,174,169,5,'#fff');
 }
 if(i===28){circle(320,105,100,'#4e5b62');circle(320,105,49,'#a6bcb0');label('회전교차로',320,112,'#17342a');}
 car(363,i===39?220:207,'#237a61','A');
 switch(i){
 case 21:car(434,73,'#7b4a25','버스',48,128);break;
 case 22:car(360,101,'#365166','앞차');break;
 case 23:car(436,84,'#365166','정차');circle(415,141,9,'#f8cf65');label('자전거',403,119);break;
 case 24:circle(415,144,10,'#e9ab55');break;
 case 25:car(421,98,'#805229','화물차',60,140);box(445,0,50,86,'#a6bcb0');break;
 case 26:car(435,87,'#365166','후진');box(437,153,9,6,'#fff');box(468,153,9,6,'#fff');break;
 case 27:box(513,74,29,69,'#233739');circle(527,88,9,'#f34343');circle(527,120,9,'#52756c');break;
 case 28:car(390,56,'#365166','B',38,62);break;
 case 29:car(219,44,'#365166','B',65,45);break;
 case 30:car(420,174,'#805229','정차');circle(429,149,9,'#f7cb60');break;
 case 31:car(363,254,'#9d302f','',45,70);label('구급차',437,274,'#fff');break;
 case 32:car(362,0,'#365166','앞차',50,70);car(421,0,'#805229','정체',48,70);break;
 case 33:car(238,113,'#365166','본선');label('합류 차로',414,150);break;
 case 39:car(419,210-Math.min(1,t*2.4)*36,'#805229','앞차');if(t>.48)circle(482-(t-.48)*158,145,11,'#ffd25e');break;
 }
}
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.action==='start')start();
 else if(b.dataset.action==='submit'){document.querySelector('#unanswered').textContent=answered()===40?'40문항을 모두 풀었습니다.':'답안이 미완료인 문항이 '+(40-answered())+'개 있습니다.';dialog.showModal();}
 else if(b.dataset.action==='play')play();
 else if(b.dataset.option!==undefined)pick(+b.dataset.option);
 else if(b.dataset.step!==undefined)step(+b.dataset.step);
});
dialog.addEventListener('close',()=>{if(dialog.returnValue==='submit')finish();dialog.returnValue='';});
render();setInterval(tick,250);
</script></body></html>
